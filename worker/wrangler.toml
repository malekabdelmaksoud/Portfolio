name = "melek-portfolio-api"
main = "src/index.js"
compatibility_date = "2026-11-21"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "melek-portfolio-db"
database_id = "15577d7f-b636-4fa6-817c-8f0c77731927"
migrations_dir = "migrations"

[ai]
binding = "AI"

[vars]
ALLOWED_ORIGIN = "https://portfolio.melekabdelmaksoud72.workers.dev"
# AI_MODEL, TURNSTILE_SECRET, TURNSTILE_SITE_KEY, RESEND_API_KEY, EMAIL_FROM, SESSION_PEPPER,
# OTP_PEPPER, ACCESS_ISSUER, ACCESS_AUD, and ADMIN_EMAIL are runtime secrets.

[assets]
directory = "./admin-assets"
binding = "ASSETS"
run_worker_first = ["/api/*"]

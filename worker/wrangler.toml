name = "melek-portfolio-api"
main = "src/index.js"
compatibility_date = "2026-11-21"
workers_dev = true

# Create the D1 database, then replace the database_id before deploying.
[[d1_databases]]
binding = "DB"
database_name = "melek-portfolio"
database_id = "00000000-0000-0000-0000-000000000000" # Replace with the real ID returned by `wrangler d1 create`
migrations_dir = "migrations"

[vars]
ADMIN_EMAIL = "melekabdelmaksoud72@gmail.com"

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#090a0c"><title>Reset password — Melek AI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/account.css"><script src="/api-config.js"></script><script defer src="/password-reset.js"></script></head>
<body><main class="auth-screen"><section class="auth-card" aria-labelledby="reset-title"><div class="assistant-mark">M<i></i></div><p class="eyebrow">MELEK AI ACCOUNT</p><h1 id="reset-title">Reset your password</h1><p class="auth-copy">Enter your account email. We’ll send a one-time reset code if email delivery is configured.</p><form id="reset-request-form"><label for="reset-email">Email address</label><input id="reset-email" type="email" maxlength="254" autocomplete="email" required><div id="reset-turnstile-wrap"></div><button class="auth-primary" type="submit">Send reset code</button></form><form id="reset-verify-form" hidden><label for="reset-code">Six-digit code</label><input id="reset-code" type="text" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" required><label for="reset-password">New password</label><input id="reset-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><button class="auth-primary" type="submit">Set new password</button></form><p class="auth-error" id="reset-error" role="alert"></p><a class="forgot-password-link" href="/account.html">← Back to sign in</a></section></main></body></html>

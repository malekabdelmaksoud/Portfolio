<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in — Melek AI</title>
  <link rel="stylesheet" href="auth-pages.css">
  <script src="api-config.js"></script>
  <script defer src="auth-pages.js"></script>
</head>
<body data-auth-page="login">
  <main class="auth-page">
    <a class="auth-brand" href="https://portfolio.melekabdelmaksoud72.workers.dev/">M<span>.</span> AI</a>
    <button type="button" id="page-theme-toggle" class="auth-theme-btn" title="Switch theme: Obsidian / Daylight / Atelier">🌙 Obsidian</button>
    <section class="auth-card">
      <p class="eyebrow">PRIVATE AI WORKSPACE</p>
      <h1>Welcome back</h1>
      <p class="auth-copy">Sign in to access Melek AI and your private conversations.</p>
      <div id="google-signin" class="google-signin"><button type="button" class="google-btn" id="google-fallback-btn"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Continuer avec Google</span></button></div>
      <div class="divider"><span>or continue with email</span></div>
      <form id="login-form">
        <label for="login-email">Email address</label>
        <input id="login-email" name="email" type="email" autocomplete="username" maxlength="254" required>
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required>
        <button class="primary" type="submit">Sign in</button>
      </form>
      <button class="text-link" id="forgot-password" type="button">Forgot password?</button>
      <section class="reset-panel" id="reset-panel" hidden>
        <h2>Reset password</h2>
        <form id="reset-request-form">
          <label for="reset-email">Email address</label>
          <input id="reset-email" name="email" type="email" autocomplete="username" maxlength="254" required>
          <div id="reset-turnstile"></div>
          <button class="primary" type="submit">Send reset code</button>
        </form>
        <form id="reset-verify-form" hidden>
          <label for="reset-code">Six-digit code</label>
          <input id="reset-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
          <label for="reset-password">New password</label>
          <input id="reset-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
          <button class="primary" type="submit">Set new password</button>
        </form>
        <p class="error" id="reset-error" role="alert"></p>
      </section>
      <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
      <p class="error" id="auth-error" role="alert"></p>
    </section>
  </main>
</body>
</html>

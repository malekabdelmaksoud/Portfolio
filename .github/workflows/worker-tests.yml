name: Portfolio Worker tests
on:
  push:
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Worker API tests
        working-directory: worker
        run: node --check src/index.js && node --check ../admin.js && node --check ../script.js && node --check ../portfolio-auth-core.js && node --test test/*.test.js

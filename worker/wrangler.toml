name = "melek-portfolio-api"
main = "src/index.js"
compatibility_date = "2026-11-21"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "melek-portfolio-db"
database_id = "15577d7f-b636-4fa6-817c-8f0c77731927"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGIN = "https://portfolio.melekabdelmaksoud72.workers.dev"
AI_DEFAULT_MODEL = "@cf/zai-org/glm-4.7-flash"
# MELEK_AI_MODEL_VERSION, MELEK_AI_TRAINING_STATUS, MELEK_AI_SERVICE_URL,
# MELEK_AI_SERVICE_TOKEN, TURNSTILE_SECRET, TURNSTILE_SITE_KEY, RESEND_API_KEY, EMAIL_FROM, SESSION_PEPPER,
# OTP_PEPPER, ACCESS_ISSUER, ACCESS_AUD, and ADMIN_EMAIL are runtime secrets.

[triggers]
crons = ["0 3 * * *"]

[ai]
binding = "AI"

# Cloudflare R2 bucket binding for encrypted automated backups:
# Once created in the Cloudflare dashboard (R2 -> Create Bucket -> melek-portfolio-backups),
# uncomment the block below to bind it to the Worker:
# [[r2_buckets]]
# binding = "BACKUP_BUCKET"
# bucket_name = "melek-portfolio-backups"

[assets]
directory = "./admin-assets"
binding = "ASSETS"
run_worker_first = ["/api/*"]

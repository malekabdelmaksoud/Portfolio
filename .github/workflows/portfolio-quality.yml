name: Portfolio quality checks

on:
  push:
    branches: [main, feature/native-otp-workers-ai]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run portfolio regression tests
        run: npm test

name: Deploy portfolio API

on:
  workflow_dispatch:
    inputs:
      confirm_workers_free:
        description: "Confirm this Cloudflare account is on Workers Free and must never be upgraded or billed."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm_workers_free == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Worker regression tests
        working-directory: worker
        run: npm test

      - name: Install Wrangler
        working-directory: worker
        run: npm install --no-save wrangler@4

      - name: Sync admin assets
        working-directory: worker
        run: npm run sync-admin

      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply melek-portfolio-db --remote

      - name: Deploy API Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
